services:
  backend:
    image: omsinghal852/url-shortner:backend-latest
    container_name: url-shortener-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
    expose:
      - "8000"
    networks:
      - url_shortener_net

  frontend:
    image: omsinghal852/url-shortner:frontend-latest
    container_name: url-shortener-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - url_shortener_net

  nginx:
    image: nginx:1.27-alpine
    container_name: url-shortener-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - url_shortener_net

networks:
  url_shortener_net:
    driver: bridge
